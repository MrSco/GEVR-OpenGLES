name: Crash report
description: The game closed, froze, or hard-crashed
title: "[Crash] "
labels: ["crash", "beta"]
body:
  - type: markdown
    attributes:
      value: |
        Sorry it crashed - reports like this help a lot. Current zip is **vr440**.

        Play steps: [README Play](https://github.com/no6969el/GEVR/blob/main/README.md#play-vr440). Download: [vr440 zip](https://github.com/no6969el/GEVR/releases/tag/vr440). How to report: [CONTRIBUTING](https://github.com/no6969el/GEVR/blob/main/CONTRIBUTING.md).

        **Do not upload ROM files** (no `.z64` / `.n64` / `.v64`, no dumps, no paste of ROM bytes).

  - type: input
    id: headset_model
    attributes:
      label: Headset model
      description: Which headset were you using? (or "none" if monitor only - use Play-on-monitor.bat when you have no headset)
      placeholder: Pimax Crystal Super
    validations:
      required: true

  - type: dropdown
    id: openxr_runtime
    attributes:
      label: OpenXR runtime
      description: Which OpenXR runtime was active for GEVR?
      options:
        - SteamVR
        - PimaxXR (native Pimax)
        - Virtual Desktop (VDXR)
        - Other (say which below)
        - Not sure / not using VR
    validations:
      required: true

  - type: dropdown
    id: steamvr_running
    attributes:
      label: Is SteamVR running?
      description: SteamVR can be installed but off - pick what matches your session.
      options:
        - Yes
        - No
        - Not installed
        - Not sure
    validations:
      required: true

  - type: dropdown
    id: display_target
    attributes:
      label: Where was the picture right before the crash?
      description: Headset (HMD) vs flat monitor. If you had no headset, Play-on-monitor.bat is the flat launcher.
      options:
        - In the headset (HMD)
        - Flat on the monitor only
        - Black screen / no image
        - Never got a picture
    validations:
      required: true

  - type: dropdown
    id: start_gevr_bat
    attributes:
      label: Did you start with Start-GEVR.bat?
      description: Headset KEEP launcher in the vr440 zip. If you have no headset, use Play-on-monitor.bat from the same zip, then pick No (used Play-on-monitor.bat).
      options:
        - Yes
        - No (used Play-on-monitor.bat)
        - No (something else)
        - Not sure
    validations:
      required: true

  - type: dropdown
    id: build_tag
    attributes:
      label: Which Beta zip?
      description: Current Latest is vr440. See README Play. Only vr440 has a zip; older tag pages may remain without zips.
      options:
        - vr440 (current Latest)
        - Older tag (name it in the notes)
        - Not sure
    validations:
      required: true

  - type: textarea
    id: repro_steps
    attributes:
      label: What were you doing right before it crashed?
      description: Short steps or one paragraph is fine.
    validations:
      required: true

  - type: textarea
    id: expected
    attributes:
      label: What you expected
      description: e.g. keep playing, return to menu, etc.
    validations:
      required: true

  - type: textarea
    id: actual
    attributes:
      label: What actually happened
      description: Freeze, instant close, Windows error, etc.
    validations:
      required: true

  - type: dropdown
    id: frequency
    attributes:
      label: How often does this happen?
      options:
        - Every time with the same steps
        - Sometimes
        - Only happened once
        - Not sure yet
    validations:
      required: true

  - type: textarea
    id: extra
    attributes:
      label: On-screen message, Windows error, or log lines
      description: Optional - no ROM files.
    validations:
      required: false
